<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="head">
    <svg class="mark" viewBox="0 0 24 24" aria-hidden="true">
      <g fill="currentColor">
        <rect x="0.8" y="1.6" width="22.4" height="15.6" rx="4.64"/>
        <path d="M5.71 16.12H10.9L5.16 22.58Z"/>
      </g>
      <g fill="#fff">
        <rect x="5.16" y="6.57" width="11.2" height="2.15" rx="1.07"/>
        <path d="M15.27 5.09v5.12l4.64-2.56z"/>
        <rect x="7.62" y="9.81" width="11.2" height="2.15" rx="1.07"/>
        <path d="M8.71 8.32v5.11l-4.64-2.55z"/>
      </g>
    </svg>
    <div>
      <h1>Slang Translate</h1>
      <p class="sub" id="dict-line"></p>
    </div>
  </header>

  <label class="row switch-row">
    <span>
      <strong data-i18n="enabledLabel"></strong>
      <em id="state-hint"></em>
    </span>
    <input type="checkbox" id="enabled" class="switch">
  </label>

  <div class="row pause-row" id="pause-row">
    <span>
      <strong data-i18n="pauseLabel"></strong>
      <em id="pause-hint"></em>
    </span>
    <span class="pause-actions" id="pause-actions"></span>
  </div>

  <div class="row">
    <span>
      <strong data-i18n="languageLabel"></strong>
      <em data-i18n="languageHint"></em>
    </span>
    <select id="language"></select>
  </div>

  <div class="row">
    <span>
      <strong data-i18n="strictnessLabel"></strong>
      <em data-i18n="strictnessHint"></em>
    </span>
    <select id="strictness">
      <option value="strict" data-i18n="strict"></option>
      <option value="normal" data-i18n="normal"></option>
      <option value="loose" data-i18n="loose"></option>
    </select>
  </div>

  <label class="row switch-row">
    <span>
      <strong data-i18n="highlightLabel"></strong>
      <em data-i18n="highlightHint"></em>
    </span>
    <input type="checkbox" id="highlight" class="switch">
  </label>

  <section class="stats">
    <div class="count"><b id="count">0</b><span data-i18n="countSuffix"></span></div>
    <ul id="top" class="top"></ul>
    <p class="empty" id="empty"></p>
  </section>

  <footer>
    <span data-i18n="footer"></span>
    <span class="version" id="version"></span>
  </footer>

  <script src="../lib/pause.js"></script>
  <script src="../data/phrases.js"></script>
  <script src="../data/slang-ro.js"></script>
  <script src="../data/slang-en.js"></script>
  <script src="../data/packs.js"></script>
  <script src="popup.js"></script>
</body>
</html>
